<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paper Citation Graph</title>
<style>
  :root { --bg:#0b1020; --ink:#e8ecf7; --muted:#93a0c0; --line:#2a3352; --panel:#131a2e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding:32px 24px 16px; text-align:center;
    background:linear-gradient(135deg, rgba(34,211,238,.14), rgba(167,139,250,.14) 50%, rgba(244,114,182,.14));
    border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:28px;
    background:linear-gradient(90deg,#22d3ee,#a78bfa 50%,#fb7185); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { color:var(--muted); margin:8px auto 0; max-width:640px; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
  canvas { width:100%; height:560px; background:radial-gradient(800px 400px at 50% 20%, #17223f 0%, transparent 60%), #0d132a;
    border:1px solid var(--line); border-radius:16px; display:block; }
  .note { color:var(--muted); font-size:13px; margin-top:12px; text-align:center; }
  .legend { display:flex; gap:16px; justify-content:center; margin-top:14px; color:var(--muted); font-size:13px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .swatch { width:12px; height:12px; border-radius:3px; }
  #tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; max-width:320px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.4); display:none; z-index:5; }
  #tip b { color:#fff; }
</style>
</head>
<body>
<header>
  <h1>Paper Citation Graph</h1>
  <p>Cross-paper relationships across every paper reproduced in this repository. Nodes are papers; arrows point from a citing paper to the paper it cites. Hover a node for details.</p>
</header>
<div class="wrap">
  <canvas id="graph" width="1060" height="560"></canvas>
  <div class="legend">
    <span><span class="swatch" style="background:#22d3ee"></span> reproduced</span>
    <span><span class="swatch" style="background:#64748b"></span> planned</span>
    <span>→ cites</span>
  </div>
  <p class="note" id="note">Loading papers.json…</p>
</div>
<div id="tip"></div>

<script>
const palette = ['#22d3ee','#a78bfa','#fb7185','#f59e0b','#34d399','#f472b6','#60a5fa'];
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
let nodes = [], edges = [];

function layout(papers) {
  const cx = canvas.width/2, cy = canvas.height/2;
  const R = Math.min(cx, cy) - 90;
  return papers.map((p, i) => {
    const ang = papers.length === 1 ? -Math.PI/2 : (i / papers.length) * Math.PI*2 - Math.PI/2;
    const r = papers.length === 1 ? 0 : R;
    return { ...p, x: cx + Math.cos(ang)*r, y: cy + Math.sin(ang)*r, color: palette[i % palette.length] };
  });
}

function drawArrow(a, b) {
  const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1;
  const ux = dx/len, uy = dy/len, pad = 34;
  const x1=a.x+ux*pad, y1=a.y+uy*pad, x2=b.x-ux*pad, y2=b.y-uy*pad;
  ctx.strokeStyle='#3b4a78'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const ah=9, ang=Math.atan2(y2-y1,x2-x1);
  ctx.fillStyle='#3b4a78'; ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-ah*Math.cos(ang-0.4), y2-ah*Math.sin(ang-0.4));
  ctx.lineTo(x2-ah*Math.cos(ang+0.4), y2-ah*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
}

function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  edges.forEach(e => {
    const a = nodes.find(n=>n.id===e.from), b = nodes.find(n=>n.id===e.to);
    if (a && b) drawArrow(a, b);
  });
  nodes.forEach(n => {
    ctx.beginPath(); ctx.arc(n.x, n.y, 30, 0, Math.PI*2);
    ctx.fillStyle = n.status==='reproduced' ? n.color : '#64748b';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#07101f'; ctx.font = 'bold 13px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(n.year), n.x, n.y);
    ctx.fillStyle = '#e8ecf7'; ctx.font = '13px -apple-system, sans-serif';
    const words = n.title.split(' ');
    let line='', ly = n.y + 46; const lines=[];
    words.forEach(w => { if ((line+' '+w).length > 22){ lines.push(line); line=w; } else line = line? line+' '+w : w; });
    if (line) lines.push(line);
    lines.forEach((l,i)=> ctx.fillText(l, n.x, ly + i*16));
  });
}

canvas.addEventListener('mousemove', ev => {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
  const mx = (ev.clientX-rect.left)*sx, my = (ev.clientY-rect.top)*sy;
  const hit = nodes.find(n => Math.hypot(n.x-mx, n.y-my) <= 30);
  if (hit) {
    tip.style.display='block'; tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY+14)+'px';
    tip.innerHTML = `<b>${hit.title}</b> (${hit.year})<br>${(hit.authors||[]).slice(0,3).join(', ')}${(hit.authors||[]).length>3?' et al.':''}` +
      `<br><span style="color:#93a0c0">${hit.summary||''}</span>` +
      (hit.arxiv?`<br><span style="color:#22d3ee">arXiv:${hit.arxiv}</span>`:'');
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='default'; }
});

const FALLBACK = { papers:[{id:'attention-is-all-you-need',title:'Attention Is All You Need',year:2017,status:'reproduced',authors:['Vaswani et al.'],arxiv:'1706.03762',summary:'Introduces the Transformer.'}], citations:[] };

(async function init() {
  let data = FALLBACK, live = false;
  if (location.protocol.startsWith('http')) {
    try { const r = await fetch('papers.json',{cache:'no-store'}); if (r.ok){ data = await r.json(); live=true; } } catch(e){}
  }
  nodes = layout(data.papers || []);
  edges = data.citations || [];
  render();
  document.getElementById('note').textContent = live
    ? `${nodes.length} paper(s), ${edges.length} citation edge(s) — from papers.json.`
    : `Showing a built-in sample. Serve the repo root (python -m http.server) to load papers.json live.`;
})();
</script>
</body>
</html>
